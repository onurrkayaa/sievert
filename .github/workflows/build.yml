name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

      # Sievert kendi koduna kendi kurallarini uyguluyor. Ayarlar repo kokundeki
      # sievert.json'dan geliyor, burada bayrak yok: samples/ oradan disarida
      # birakiliyor, cunku o dosyalar bilerek hatali ve testlerin okumasi icin duruyorlar.
      - name: sievert kendi kendini tariyor
        run: dotnet run --project src/Sievert.Cli --no-build -- check .
