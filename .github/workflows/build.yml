name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore
      # Test sonuclari artefakt olarak saklaniyor. Sebep: bir kosuda tek bir test
      # dustu ve hangisi oldugu gorulemedi, cunku ozet disinda kayit kalmiyordu.
      # Zaman asimi degerine dokunmadim; once hangi testin dustugunu bilmek gerekiyor.
      # LogFileName VERILMIYOR. Iki test projesi var ve sabit bir ad verilince ikincisi
      # birincinin dosyasini eziyor; artefaktta tek projenin sonucu kaliyor. Adsiz
      # birakilinca her proje kendi dosyasini yaziyor.
      - run: dotnet test --no-build --logger trx --results-directory test-sonuclari

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-sonuclari
          path: test-sonuclari/
          retention-days: 30

      # Asagidaki iki adim ayni kodu tariyor ama farkli sorulari cevapliyor.
      #
      # Birincisi aracin SAVUNDUGU VARSAYILANI siniyor: repo kokundeki sievert.json ne
      # diyorsa o. SV003 ve SV005 varsayilan olarak kapali (precision'lari %0 olculdu,
      # bkz. docs/olcumler/asama3-precision.md). Bu adim kirilirsa CI kirilir, cunku
      # kullanicinin kutudan cikan haliyle gordugu sey budur.
      - name: sievert kendi kendini tariyor (varsayilan kume)
        run: dotnet run --project src/Sievert.Cli --no-build -- check .

      # Ikincisi aracin TAMAMINI siniyor: varsayilan olarak kapali olan kurallar da
      # dahil. Amaci bulgu bulmak degil, kapali kurallarin hala calisir durumda
      # oldugunu ve kendi kodumuz uzerinde ne soyledigini gormek. Bu adim CI'i
      # KIRMIYOR: kapali kurallarin precision'i dusuk, urettikleri bulgu bir
      # basarisizlik olcutu degil. Cikti loglarda duruyor.
      - name: sievert kendi kendini tariyor (tum kurallar)
        continue-on-error: true
        run: dotnet run --project src/Sievert.Cli --no-build -- check . --config .github/sievert-tum-kurallar.json

      # Tek komutluk demo gercekten aciliyor mu: PostgreSQL container'i, migration, demo
      # verisi, API, panel ve bir PDF raporu. GitHub'in ubuntu kosucusunda Docker var,
      # o yuzden atlanmiyor; atlansaydi "CI yesil ama demo bozuk" mumkun olurdu.
      #
      # Adim CI'i KIRIYOR: demo, bu turun iki teslimatindan biri.
      - name: tek komutluk demo duman testi
        run: dotnet run --project tools/Sievert.Demo --no-build -- --smoke-test --no-open
