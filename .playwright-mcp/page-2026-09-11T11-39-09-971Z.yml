              - article [ref=e392]:
                - generic [ref=e393]:
                  - heading "Sievert" [level=1] [ref=e394]
                  - 'link "Permalink: Sievert" [ref=e395] [cursor=pointer]':
                    - /url: "#sievert"
                - paragraph [ref=e398]: A command line tool that looks at a .NET repository and estimates how risky each commit is.
                - generic [ref=e399]:
                  - heading "The problem" [level=2] [ref=e400]
                  - 'link "Permalink: The problem" [ref=e401] [cursor=pointer]':
                    - /url: "#the-problem"
                - paragraph [ref=e404]: When you review a commit, you only see the diff. The code usually looks fine, because people don't write obviously broken code on purpose. But part of the risk isn't in the code at all - it's in the history of the file you are touching. A file that has been fixed five times in the last two months, or that a lot of different people keep editing, is more likely to break again. That information is sitting in git, it's just not in front of you while you are reviewing.
                - generic [ref=e405]:
                  - heading "Approach" [level=2] [ref=e406]
                  - 'link "Permalink: Approach" [ref=e407] [cursor=pointer]':
                    - /url: "#approach"
                - paragraph [ref=e410]: "Two sources of signal, combined into one score:"
                - list [ref=e411]:
                  - listitem [ref=e412]:
                    - strong [ref=e413]: Roslyn
                    - text: parses the C# code and looks for .NET specific patterns that tend to cause bugs (things like async usage, disposal, null handling).
                  - listitem [ref=e414]:
                    - strong [ref=e415]: Git history
                    - text: "gives change signals for the files in the commit: how often they change, how many different authors touch them, how many past fixes they were part of."
                - paragraph [ref=e416]: The output is a risk score with a short explanation of why it came out that way. The explanation matters more than the number - a score you can't question isn't useful.
                - generic [ref=e417]:
                  - heading "Project structure" [level=2] [ref=e418]
                  - 'link "Permalink: Project structure" [ref=e419] [cursor=pointer]':
                    - /url: "#project-structure"
                - generic [ref=e422]:
                  - code [ref=e424]: "Sievert.slnx solution file (new .slnx format, .NET 10) Directory.Build.props shared build settings for all projects global.json pins the SDK version src/ Sievert.Core/ shared models and helpers, depends on nothing Sievert.Analysis/ the actual analysis: Roslyn + git history Sievert.Cli/ console app, this is what you run tests/ Sievert.Tests/ xUnit tests samples/Patients/ sample repositories to test against docs/adr/ short notes on why things were decided this way docs/proje-notlari.md working notes: goal, technical decisions, conventions"
                  - button "Copy code to clipboard" [ref=e426] [cursor=pointer]
                - generic [ref=e430]:
                  - heading "Getting started" [level=2] [ref=e431]
                  - 'link "Permalink: Getting started" [ref=e432] [cursor=pointer]':
                    - /url: "#getting-started"
                - paragraph [ref=e435]:
                  - text: You need the .NET 10 SDK. The exact version is pinned in
                  - code [ref=e436]: global.json
                  - text: .
                - generic [ref=e437]:
                  - generic [ref=e438]: git clone <repo-url> cd sievert dotnet build dotnet test dotnet run --project src/Sievert.Cli
                  - button "Copy code to clipboard" [ref=e440] [cursor=pointer]
                - paragraph [ref=e444]:
                  - text: Right now there are two commands.
                  - code [ref=e445]: sievert scan <path>
                  - text: reads the C# files under a path and prints the types and methods it found as a tree, with a summary at the end.
                  - code [ref=e446]: sievert check <path>
                  - text: runs the rules instead and prints each finding as a diagnostic card; it exits with 1 if it finds anything at or above the
                  - code [ref=e447]: "--fail-on"
                  - text: level (warning by default). Both commands take
                  - code [ref=e448]: "--json"
                  - text: ". There are six rules:"
                - table [ref=e450]:
                  - rowgroup [ref=e451]:
                    - row [ref=e452]:
                      - columnheader "Code" [ref=e453]
                      - columnheader "Severity" [ref=e454]
                      - columnheader "What it looks for" [ref=e455]
                  - rowgroup [ref=e456]:
                    - row [ref=e457]:
                      - cell "SV001" [ref=e458]
                      - cell "error" [ref=e459]
                      - cell [ref=e460]:
                        - code [ref=e461]: async void
                        - text: methods that aren't event handlers
                    - row [ref=e462]:
                      - cell "SV002" [ref=e463]
                      - cell "warning" [ref=e464]
                      - cell [ref=e465]:
                        - text: blocking on a task with
                        - code [ref=e466]: .Result
                        - text: ","
                        - code [ref=e467]: .Wait()
                        - text: or
                        - code [ref=e468]: .GetAwaiter().GetResult()
                    - row [ref=e469]:
                      - cell "SV003" [ref=e470]
                      - cell "warning" [ref=e471]
                      - cell "a call whose returned task is dropped on the floor" [ref=e472]
                    - row [ref=e473]:
                      - cell "SV004" [ref=e474]
                      - cell "warning" [ref=e475]
                      - cell "a query-looking call inside a loop body (N+1)" [ref=e476]
                    - row [ref=e477]:
                      - cell "SV005" [ref=e478]
                      - cell "warning" [ref=e479]
                      - cell [ref=e480]:
                        - text: a
                        - code [ref=e481]: new
                        - text: of something disposable that never gets disposed
                    - row [ref=e482]:
                      - cell "SV006" [ref=e483]
                      - cell "info" [ref=e484]
                      - cell [ref=e485]:
                        - text: a public
                        - code [ref=e486]: Task
                        - text: method with no
                        - code [ref=e487]: CancellationToken
                        - text: parameter
                - paragraph [ref=e488]:
                  - text: All of them decide what things are by looking at names, because there is no semantic model yet. That produces false positives, which is a trade I took on purpose -
                  - code [ref=e489]: docs/adr/0010-ad-temelli-tespit-ve-kabul-edilen-yanlis-pozitifler.md
                  - text: explains the trade and
                  - code [ref=e490]: docs/sinirliliklar.md
                  - text: lists what goes wrong in each direction, rule by rule.
                - paragraph [ref=e491]:
                  - text: SV006 is
                  - code [ref=e492]: info
                  - text: rather than a warning on purpose. It fires on nearly every async method in a codebase that never thought about cancellation, and
                  - code [ref=e493]: "--fail-on"
                  - text: defaults to
                  - code [ref=e494]: warning
                  - text: ", so it shows up in the output without breaking anyone's build."
                - paragraph [ref=e495]:
                  - text: Both commands also take
                  - code [ref=e496]: "--exclude <pattern>"
                  - text: ", and you can pass it more than once."
                  - code [ref=e497]: "*"
                  - text: matches inside one path segment and
                  - code [ref=e498]: "**"
                  - text: "matches zero or more segments, so patterns look like this:"
                - generic [ref=e499]:
                  - generic [ref=e500]:
                    - text: dotnet run --project src/Sievert.Cli -- check . --exclude
                    - generic [ref=e501]: "'samples/**'"
                    - text: "--exclude"
                    - generic [ref=e502]: "'**/*.Designer.cs'"
                  - button "Copy code to clipboard" [ref=e504] [cursor=pointer]
                - paragraph [ref=e508]:
                  - text: Quote the pattern. Without quotes your shell expands it before the tool sees it, and
                  - code [ref=e509]: samples/**
                  - text: turns into
                  - code [ref=e510]: samples/Patients
                  - text: ", which matches nothing. A pattern that cannot be parsed is a usage error and exits 2, rather than being skipped silently. The summary always prints how many files were excluded, so you can tell a working pattern from a typo."
                - paragraph [ref=e511]:
                  - code [ref=e512]: bin
                  - text: ","
                  - code [ref=e513]: obj
                  - text: ","
                  - code [ref=e514]: .git
                  - text: and
                  - code [ref=e515]: node_modules
                  - text: are never scanned at all, so you do not need a pattern for them. They are not counted in the excluded number either.
                - paragraph [ref=e516]:
                  - text: CI runs
                  - code [ref=e517]: check
                  - text: "on this repository itself, right after the tests, so the tool has to pass its own rules:"
                - generic [ref=e518]:
                  - generic [ref=e519]: dotnet run --project src/Sievert.Cli -- check .
                  - button "Copy code to clipboard" [ref=e521] [cursor=pointer]
                - paragraph [ref=e525]:
                  - text: There is no flag on that line because this repository has its own
                  - code [ref=e526]: sievert.json
                  - text: at the root, and the tool reads it the same way it would read yours.
                  - code [ref=e527]: samples/
                  - text: is excluded there because those files are broken on purpose - they are test data the test project reads.
                - generic [ref=e528]:
                  - heading "Configuration" [level=2] [ref=e529]
                  - 'link "Permalink: Configuration" [ref=e530] [cursor=pointer]':
                    - /url: "#configuration"
                - paragraph [ref=e533]:
                  - code [ref=e534]: sievert.json
                  - text: is optional. If there is one in the directory you are scanning it gets read; if there isn't, every rule runs and nothing is excluded.
                  - code [ref=e535]: "--config <path>"
                  - text: points at a different file, and in that case the file has to exist.
                  - code [ref=e536]: "--config"
                  - text: is resolved against your current working directory, not against the directory being scanned.
                - generic [ref=e537]:
                  - generic [ref=e538]:
                    - text: "{ \"rules\": [ { \"code\":"
                    - generic [ref=e539]: "\"SV001\""
                    - text: ", \"enabled\": true, \"severity\":"
                    - generic [ref=e540]: "\"warning\""
                    - text: "} ], \"exclude\": ["
                    - generic [ref=e541]: "\"samples/**\""
                    - text: "] }"
                  - button "Copy code to clipboard" [ref=e543] [cursor=pointer]
                - paragraph [ref=e547]:
                  - text: The file only turns rules on and off and overrides how serious their findings are. What a rule actually looks for stays in the code - see
                  - code [ref=e548]: docs/adr/0009-kural-katalogu-ve-yapilandirma.md
                  - text: for why.
                  - code [ref=e549]: severity
                  - text: is applied before
                  - code [ref=e550]: "--fail-on"
                  - text: is checked, so setting a rule to
                  - code [ref=e551]: info
                  - text: really does stop it from breaking the build.
                - paragraph [ref=e552]:
                  - text: Rules you don't mention keep running with their defaults, so adding a new rule later doesn't get silently disabled by an old config file. A rule code the tool doesn't know, or a property name it doesn't know, is an error and exits 2 - a typo shouldn't quietly turn a rule off.
                  - code [ref=e553]: exclude
                  - text: here and
                  - code [ref=e554]: "--exclude"
                  - text: on the command line are added together; neither replaces the other.
                - paragraph [ref=e555]: "The summary prints which rules ran and which ones the config turned off, how many files were excluded, and how many directories were never entered at all:"
