                - paragraph [ref=e604]:
                  - text: Early development, v0.1.0. Stages 0, 1 and 2 are done. The project builds with CI, Roslyn parsing reads a file as structure, and the first rule SV001 runs behind the
                  - code [ref=e605]: check
                  - text: "command. SV001 was measured on two real repositories (Polly and ShareX) and a 20-line sample of its output was checked by hand: precision came out 8/10, with two false positives and one false negative that all trace back to the same cause. The numbers and what I plan to do about them are in"
                  - code [ref=e606]: docs/raporlar/asama2-kapanis.md
                  - text: ". Stage 3 has started: SV001 now also treats"
                  - code [ref=e607]: += MethodName
                  - text: in the same file or the same partial class as evidence that a method is an event handler (ADR 0008), there is an
                  - code [ref=e608]: "--exclude"
                  - text: flag, CI checks this repository with it, and rules live in a catalogue that an optional
                  - code [ref=e609]: sievert.json
                  - text: can turn on and off (ADR 0009). All six detectors for stage 3 are written and all six have now been run on three real repositories - Polly, ShareX and Jellyfin - with the numbers in
                  - code [ref=e610]: docs/olcumler/
